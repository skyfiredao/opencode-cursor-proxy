[package]
name = "cursor-proxy"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "smallvec", "std", "tracing-log"] }
tokio-stream = "0.1"
sha2 = "0.10"
percent-encoding = "2.3"
agent-client-protocol = "=5.2.0"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled", "limits"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = 0
strip = "symbols"
